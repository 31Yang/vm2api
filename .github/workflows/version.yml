# Snapshot the landed SHA after a main merge. Humans still deploy;
# this workflow must not ssh, docker push, or touch routing.json.
name: version

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  stamp:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write VERSION.txt
        run: printf '%s\n' "${GITHUB_SHA::7}" > VERSION.txt
      - uses: actions/upload-artifact@v4
        with:
          name: version
          path: VERSION.txt
          if-no-files-found: error
